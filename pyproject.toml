[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "runtape"
version = "0.4.0"
description = "Record AI agent runs locally and find which part of the context caused a decision."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Rehan Mohammed" }]
keywords = ["agents", "llm", "debugging", "tracing", "observability", "prompt-injection", "attribution", "openai", "anthropic", "langgraph", "ollama", "mcp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Debuggers",
]
dependencies = ["rich>=13"]

[project.scripts]
runtape = "runtape.cli:main"

[project.optional-dependencies]
langchain = ["langchain-core>=0.3"]
mcp = ["mcp>=1.2"]
dev = ["pytest", "pytest-asyncio", "openai", "anthropic", "httpx", "langchain-core", "langgraph", "langchain-anthropic", "mcp", "build", "twine"]

[project.urls]
Homepage = "https://github.com/RehanMohammed985/runtape"
Issues = "https://github.com/RehanMohammed985/runtape/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/runtape"]

[tool.hatch.build.targets.sdist]
exclude = ["bench/traces", "bench/results", "bench/seed1", "bench/_local_runs", "bench/.cache", "bench/*.tgz", ".runtape", "docs/*.gif", "docs/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
