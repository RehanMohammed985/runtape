[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "runtape"
version = "0.1.0"
description = "A flight recorder for AI agents: record every step to a local trace, replay it like a debugger."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "openai", "anthropic", "httpx"]

[tool.hatch.build.targets.wheel]
packages = ["src/runtape"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
